name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Smoketest — shoes-mcp
        run: node packages/demos/shoes-mcp/dist/smoketest.js

      - name: Smoketest — orders-mcp
        run: node packages/demos/orders-mcp/dist/smoketest.js

      - name: Smoketest — incidents-mcp
        run: node packages/demos/incidents-mcp/dist/smoketest.js

      - name: Smoketest — recipes-mcp
        run: node packages/demos/recipes-mcp/dist/smoketest.js

      - name: Smoketest — mcp-lens-server
        run: node packages/mcp-lens-server/dist/smoketest.js
